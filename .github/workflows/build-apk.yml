name: Build Exclave APK

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean Project
      run: ./gradlew clean

    # اضافه کردن پارامترهای نادیده‌گرفتن هشدارهای کامپایلر برای عبور از سد KSP
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-build-cache -Dorg.gradle.kotlin.dsl.caches.shared=false
