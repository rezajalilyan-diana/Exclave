name: Build Exclave APK

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # آپدیت به نسخه v4.2.2 که رسماً با رانرهای جدید هماهنگ است
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'

    # آپدیت به نسخه v4.3.0 یا بالاتر که مشکل Node.js 20 را کاملاً برطرف کرده
    - name: Set up JDK 17
      uses: actions/setup-java@v4.3.0
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Exclave-Optimized-APK
        path: app/build/outputs/apk/debug/*.apk
