name: Build Exclave APK

on:
  push:
    branches: [ "dev", "main" ] # هر زمان روی این برنچ‌ها کد بزنی، خودکار بیلد می‌شود
  workflow_dispatch: # به تو اجازه می‌دهد دستی هم بیلد را اجرا کنی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # اگر پروژه ساب‌ماژول شبکه‌ای دارد لود شود

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Exclave-Optimized-APK
        path: app/build/outputs/apk/debug/*.apk
