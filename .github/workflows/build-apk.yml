name: Build Exclave APK

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # استفاده از نسخه v5 (بتا/پایدار جدید) که کاملاً با نود ۲۴ سازگار است
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    # استفاده از نسخه v5.0.0 یا بالاتر برای جاوا جهت حذف کامل وارنینگ نود
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-build-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Exclave-Optimized-APK
        path: app/build/outputs/apk/debug/*.apk
